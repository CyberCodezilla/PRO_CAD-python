name: Release Python CAD Pro (Windows Standalone)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Publish Windows Standalone Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies & Requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Execute Automated Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Build Standalone Executable via PyInstaller
        run: |
          python build_dist.py

      - name: Archive Distribution Package into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PythonCADPro/* -DestinationPath PythonCADPro-Windows.zip -Force

      - name: Publish GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: PythonCADPro-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
